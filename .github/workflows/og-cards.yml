name: OG cards preview

# Optional manual feedback. Canonical cards are generated locally with
# node scripts/generate-og.js and landed through the normal candidate branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install preview tools
        run: |
          npm install playwright@^1.60.0 --no-save
          npx playwright install --with-deps chromium
      - name: Generate social cards
        run: node scripts/generate-og.js
      - name: Upload preview for review
        uses: actions/upload-artifact@v4
        with:
          name: og-card-preview
          path: public/images/og/
