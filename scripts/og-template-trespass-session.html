<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #fbf9f4;
      --ink: #211a35;
      --muted: #625a71;
      --indigo: #38217f;
      --magenta: #c41d8f;
      --red: #b72228;
      --line: #d8d0e7;
      --rainbow: linear-gradient(90deg, #cc2484, #7130d7, #3e68c7, #17a8ba, #66b574, #f4ca52, #ef5f32);
    }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 12%, rgba(196,29,143,.12), transparent 26%),
        var(--paper);
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
    }
    .rainbow { height: 12px; background: var(--rainbow); }
    main {
      height: 618px;
      padding: 48px 60px 42px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 30px;
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    .kicker {
      color: var(--magenta);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.9px;
      text-transform: uppercase;
    }
    .brand { color: var(--indigo); font-size: 17px; font-weight: 800; }
    .content {
      display: grid;
      grid-template-columns: 1.5fr .9fr;
      gap: 50px;
      align-items: center;
    }
    h1 {
      color: var(--indigo);
      font: 700 68px/.98 Fraunces, Georgia, serif;
      letter-spacing: -2px;
      max-width: 690px;
    }
    .answer {
      border: 2px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      background: white;
      box-shadow: 0 18px 42px rgba(49,31,90,.10);
    }
    .answer div { padding: 24px 27px; }
    .answer div + div { border-top: 2px solid var(--line); }
    .answer strong {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }
    .lawyers strong { color: var(--indigo); }
    .council strong { color: var(--red); }
    .answer p {
      color: var(--ink);
      font: 600 25px/1.18 Fraunces, Georgia, serif;
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: end;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }
    .line {
      color: var(--muted);
      font-size: 19px;
      font-weight: 600;
    }
    .url { color: var(--magenta); font-size: 16px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="rainbow"></div>
  <main>
    <header>
      <div class="kicker">Sagamok Trespass By-law</div>
      <div class="brand">RHT Circle</div>
    </header>
    <section class="content">
      <h1>The session was backwards.</h1>
      <div class="answer">
        <div class="lawyers">
          <strong>Lawyers</strong>
          <p>Explained the draft.</p>
        </div>
        <div class="council">
          <strong>Council</strong>
          <p>Did not answer for it.</p>
        </div>
      </div>
    </section>
    <footer>
      <div class="line">Power first. Safeguards later.</div>
      <div class="url">rhtcircle.ca</div>
    </footer>
  </main>
</body>
</html>
