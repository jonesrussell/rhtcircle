<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #fbfaff;
      --ink: #211836;
      --muted: #6a607d;
      --indigo: #38217f;
      --violet: #6f42d8;
      --magenta: #c41d8f;
      --coral: #ed694e;
      --line: #dcd4ed;
      --rainbow: linear-gradient(90deg, #cc2484, #7130d7, #3e68c7, #17a8ba, #66b574, #f4ca52, #ef5f32);
    }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 18%, rgba(196,29,143,.11), transparent 24%),
        radial-gradient(circle at 10% 90%, rgba(56,33,127,.10), transparent 30%),
        var(--paper);
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
    }
    .rainbow { height: 12px; background: var(--rainbow); }
    main {
      height: 618px;
      padding: 34px 54px 30px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 22px;
    }
    header { display: flex; justify-content: space-between; align-items: start; }
    .kicker {
      color: var(--magenta);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }
    .brand { color: var(--indigo); font-size: 16px; font-weight: 800; }
    .transaction {
      display: grid;
      grid-template-columns: 1fr 110px 1.12fr;
      align-items: center;
      gap: 18px;
    }
    .price {
      height: 310px;
      border: 2px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.94);
      padding: 28px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 16px 34px rgba(45,27,88,.08);
    }
    .price.sold {
      border-color: var(--magenta);
      background: linear-gradient(145deg, #fff 25%, #fff0fa);
    }
    .label {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .amount {
      font: 700 82px/.92 Fraunces, Georgia, serif;
      letter-spacing: -3px;
      color: var(--indigo);
      white-space: nowrap;
    }
    .sold .amount { color: var(--magenta); }
    .date { color: var(--muted); font-size: 17px; font-weight: 600; }
    .arrow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--violet);
    }
    .arrow strong { font-size: 50px; line-height: 1; }
    .arrow span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
    }
    footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 28px;
    }
    h1 {
      font: 650 34px/1.05 Fraunces, Georgia, serif;
      color: var(--indigo);
      max-width: 850px;
      letter-spacing: -.5px;
    }
    .source { color: var(--muted); font-size: 12px; line-height: 1.3; text-align: right; }
  </style>
</head>
<body>
  <div class="rainbow"></div>
  <main>
    <header>
      <div class="kicker">Sagamok South Market land</div>
      <div class="brand">RHT Circle</div>
    </header>
    <section class="transaction" aria-label="South Market land transaction">
      <div class="price">
        <div class="label">Bought by seller</div>
        <div class="amount">$1.2M</div>
        <div class="date">August 8, 2023</div>
      </div>
      <div class="arrow">
        <strong>→</strong>
        <span>15 months</span>
      </div>
      <div class="price sold">
        <div class="label">Sold into Sagamok's project</div>
        <div class="amount">$7M</div>
        <div class="date">November 13, 2024</div>
      </div>
    </section>
    <footer>
      <h1>Bought for $1.2 million. Sold to Sagamok for $7 million.</h1>
      <div class="source">Ontario land registry<br>PIN 31502-0809</div>
    </footer>
  </main>
</body>
</html>
